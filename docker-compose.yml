services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wwcoderww/custom-homepage-backend:latest}
    container_name: BEbookmarks
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://myuser:mypassword@postgres_db:5432/bookmarks_db?schema=public
      BETTER_AUTH_SECRET: fbe86ff14062be4f92559c07a3608fcf33fedeb40bb3fb517ee565a010743c73
      BETTER_AUTH_URL: https://bookmarks.ezwezz.com
      FRONTEND_URL: https://bookmarks.ezwezz.com
      BACKEND_URL: https://api1.bookmarks.ezwezz.com
      NODE_ENV: production
    networks:
      - shared_postgres_network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wwcoderww/custom-homepage-frontend:latest}
    container_name: FEbookmarks
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: https://api1.bookmarks.ezwezz.com
      NODE_ENV: production
    networks:
      - shared_postgres_network

networks:
  shared_postgres_network:
    external: true
