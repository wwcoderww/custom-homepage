version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wwcoderww/custom-homepage-backend:latest}
    container_name: express_backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb?schema=public
      BETTER_AUTH_SECRET: fbe86ff14062be4f92559c07a3608fcf33fedeb40bb3fb517ee565a010743c73
      BETTER_AUTH_URL: https://ezwezz.com
      FRONTEND_URL: https://ezwezz.com
      BACKEND_URL: https://api.ezwezz.com
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wwcoderww/custom-homepage-frontend:latest}
    container_name: nextjs_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: https://api.ezwezz.com
      NODE_ENV: production
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
